name: Publish signed Widget Lab APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: Verified existing APK version
        required: true
        default: '0.3.0'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package and publish
        env:
          WIDGETLAB_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$WIDGETLAB_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd prebuilt
          sha256sum --check "WidgetLab-$WIDGETLAB_VERSION.apk.sha256"
          tag="widget-lab-$WIDGETLAB_VERSION-test"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "Widget Lab $WIDGETLAB_VERSION" \
              --notes-file "RELEASE-NOTES-$WIDGETLAB_VERSION.md" --prerelease
          fi
          gh release upload "$tag" "WidgetLab-$WIDGETLAB_VERSION.apk" "WidgetLab-$WIDGETLAB_VERSION.apk.sha256" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Widget-Lab-APK
          path: |
            prebuilt/WidgetLab-${{ inputs.version }}.apk
            prebuilt/WidgetLab-${{ inputs.version }}.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
