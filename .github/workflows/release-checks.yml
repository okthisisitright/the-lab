name: Installed release widget checks
on:
  workflow_dispatch:
    inputs:
      apk:
        description: Existing signed APK path in this repository
        default: prebuilt/WidgetLab-0.2.0.apk
        required: true
permissions:
  contents: read
jobs:
  release-widgets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check the installed signed APK, without linking app internals
        uses: reactivecircus/android-emulator-runner@v2
        env:
          WIDGETLAB_CHECK_APK: ${{ inputs.apk }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 3072
          script: bash tools/check-installed-apk.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Installed-release-results
          path: |
            releasecheck/build/reports/androidTests/
            releasecheck/build/outputs/androidTest-results/
            releasecheck/build/device-evidence/
