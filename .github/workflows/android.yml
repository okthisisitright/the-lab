name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNING_B64: ${{ secrets.WIDGETLAB_KEYSTORE_BASE64 }}
      WIDGETLAB_KEYSTORE: ${{ runner.temp }}/widgetlab-release.jks
      WIDGETLAB_STORE_PASSWORD: ${{ secrets.WIDGETLAB_STORE_PASSWORD }}
      WIDGETLAB_KEY_ALIAS: ${{ secrets.WIDGETLAB_KEY_ALIAS }}
      WIDGETLAB_KEY_PASSWORD: ${{ secrets.WIDGETLAB_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Reuse development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: widget-lab-development-key-v1
      - name: Prepare private release signing
        if: env.SIGNING_B64 != '' && github.event_name != 'pull_request'
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          path = Path(os.environ['WIDGETLAB_KEYSTORE'])
          path.write_bytes(base64.b64decode(os.environ['SIGNING_B64'], validate=True))
          path.chmod(0o600)
          PY
      - name: Verify and compile
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Development APK
        uses: actions/upload-artifact@v4
        with:
          name: Widget-Lab-development-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
      - name: Signed private release APK
        if: env.SIGNING_B64 != '' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Widget-Lab-private-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
      - name: Test and visual reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Widget-Lab-verification
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/design-review/
          retention-days: 14
      - name: Remove runner signing material
        if: always()
        run: rm -f "$WIDGETLAB_KEYSTORE"
